<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniList · аниме плеер</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">🎬 AniList</div>
    <div class="nav-links">
      <a href="#" id="homeLink">Главная</a>
      <a href="#" id="profileLink" style="display: none;">Профиль</a>
      <button id="themeToggle">🎨 Тема</button>
      <button id="loginBtn">Войти</button>
      <button id="logoutBtn" style="display: none;">Выйти</button>
    </div>
  </nav>
  <div id="searchContainer" style="max-width: 1300px; margin: 1rem auto 0; padding: 0 1.5rem;">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Поиск аниме по названию..." />
      <button id="searchBtn">🔍 Найти</button>
      <button id="clearSearchBtn" style="display: none;">✕ Очистить</button>
    </div>
  </div>
  <main id="app">
    <div id="pageContainer"></div>
  </main>
  <div id="authModal" class="modal" style="display:none;">...</div>
  <div id="avatarModal" class="modal" style="display:none;">...</div>
  <div id="vkSettingsModal" class="modal" style="display:none;">...</div>
  <div id="themeModal" class="modal" style="display:none;">...</div>
  <script src="app.js"></script>
</body>
</html>
