<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniList · аниме плеер</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- НАВИГАЦИЯ -->
  <nav class="navbar">
    <div class="logo">🎬 AniList</div>
    <div class="nav-links">
      <a href="#" id="homeLink">Главная</a>
      <a href="#" id="profileLink" style="display: none;">Профиль</a>
      <button id="themeToggle">🌙 Тема</button>
      <button id="loginBtn">Войти</button>
      <button id="logoutBtn" style="display: none;">Выйти</button>
    </div>
  </nav>

  <!-- ПОИСК (на главной) -->
  <div id="searchContainer" style="max-width: 1300px; margin: 1rem auto 0; padding: 0 1.5rem;">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Поиск аниме по названию..." />
      <button id="searchBtn">🔍 Найти</button>
      <button id="clearSearchBtn" style="display: none;">✕ Очистить</button>
    </div>
  </div>

  <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
  <main id="app">
    <div id="pageContainer"></div>
  </main>

  <!-- МОДАЛКА ВХОДА / РЕГИСТРАЦИИ -->
  <div id="authModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="authTitle">Вход</h2>
      <form id="authForm">
        <input type="text" id="authUsername" placeholder="Имя пользователя" required />
        <input type="password" id="authPassword" placeholder="Пароль" required />
        <button type="submit" id="authSubmitBtn">Войти</button>
        <p id="authToggleText">Нет аккаунта? <a href="#" id="authToggleLink">Зарегистрироваться</a></p>
      </form>
    </div>
  </div>

  <!-- МОДАЛКА АВАТАРКИ -->
  <div id="avatarModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close-avatar">&times;</span>
      <h2>Загрузить аватар</h2>
      <input type="file" id="avatarInput" accept="image/*" />
      <button id="avatarSaveBtn">Сохранить</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
